// ---------- Funções de cálculo ----------
const med = a => a.reduce((x, y) => x + y, 0) / a.length;

function sma(v, n) {
  return v.map((_, i) => i < n - 1 ? null : med(v.slice(i - n + 1, i + 1)));
}

function ema(v, n) {
  const k = 2 / (n + 1), out = [];
  let prev = null;
  v.forEach((x, i) => {
    if (i < n - 1) { out.push(null); return; }
    if (prev === null) prev = med(v.slice(0, n));
    else prev = x * k + prev * (1 - k);
    out.push(prev);
  });
  return out;
}

function rsi(v, n = 14) {
  let g = 0, p = 0;
  for (let i = 1; i <= n; i++) { const d = v[i] - v[i - 1]; d >= 0 ? g += d : p -= d; }
  g /= n; p /= n;
  for (let i = n + 1; i < v.length; i++) {
    const d = v[i] - v[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    p = (p * (n - 1) + Math.max(-d, 0)) / n;
  }
  return p === 0 ? 100 : 100 - 100 / (1 + g / p);
}

function macdHist(c) {
  const e12 = ema(c, 12), e26 = ema(c, 26);

  return { agora: h[h.length - 1], antes: h[h.length - 2] };
}
